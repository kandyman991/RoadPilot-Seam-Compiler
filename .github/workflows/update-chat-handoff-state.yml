name: Refresh chat handoff state
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read
concurrency:
  group: chat-handoff-state
  cancel-in-progress: true
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh handoff/state.json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const repoInfo=(await github.rest.repos.get({owner,repo})).data;
            const defaultBranch=repoInfo.default_branch;
            const branch=(await github.rest.repos.getBranch({owner,repo,branch:defaultBranch})).data;
            const commit=(await github.rest.repos.getCommit({owner,repo,ref:branch.commit.sha})).data;
            const prs=(await github.paginate(github.rest.pulls.list,{owner,repo,state:"open",sort:"updated",direction:"desc",per_page:100})).slice(0,25);
            const allIssues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:"open",sort:"updated",direction:"desc",per_page:100});
            const issues=allIssues.filter(i=>!i.pull_request).slice(0,25);
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({owner,repo,per_page:20})).data.workflow_runs.filter(r=>r.name!=="Refresh chat handoff state").slice(0,10);
            const state={schema:"chat-handoff-state",schemaVersion:1,repository:repoInfo.full_name,defaultBranch,generatedAt:new Date().toISOString(),generatedByEvent:context.eventName,instructions:["Read ../CHAT_HANDOFF.md first.","Treat this JSON as a mechanical snapshot, not architectural truth.","Verify live PR/CI status before changing code."],head:{sha:branch.commit.sha,message:commit.commit.message,htmlUrl:commit.html_url},openPullRequests:prs.map(p=>({number:p.number,title:p.title,draft:p.draft,head:p.head.ref,headSha:p.head.sha,base:p.base.ref,updatedAt:p.updated_at,htmlUrl:p.html_url})),openIssues:issues.map(i=>({number:i.number,title:i.title,updatedAt:i.updated_at,htmlUrl:i.html_url})),recentWorkflowRuns:runs.map(r=>({id:r.id,name:r.name,status:r.status,conclusion:r.conclusion,branch:r.head_branch,headSha:r.head_sha,event:r.event,updatedAt:r.updated_at,htmlUrl:r.html_url}))};
            const path="handoff/state.json";
            const content=Buffer.from(JSON.stringify(state,null,2)+"\n","utf8").toString("base64");
            let sha;
            try{const f=await github.rest.repos.getContent({owner,repo,path,ref:defaultBranch});if(!Array.isArray(f.data))sha=f.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:"chore: refresh chat handoff state [skip ci]",content,branch:defaultBranch,sha});
